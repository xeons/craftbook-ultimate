[versions]
java = "25"
paper = "26.2.build.+"
sponge = "20.0.0-SNAPSHOT"
# SpongeAPI 20 is built against the Adventure 4 line; Paper 26.2 ships Adventure 5.
adventure4 = "4.26.1"
adventure = "5.2.0"
jspecify = "1.0.0"
junit = "6.1.3"
assertj = "3.27.3"
mockbukkit = "4.116.1"
configurate = "4.2.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
sponge-api = { module = "org.spongepowered:spongeapi", version.ref = "sponge" }
adventure-bom = { module = "net.kyori:adventure-bom", version.ref = "adventure" }
adventure4-bom = { module = "net.kyori:adventure-bom", version.ref = "adventure4" }
adventure-api = { module = "net.kyori:adventure-api" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }
