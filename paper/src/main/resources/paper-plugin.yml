name: CraftBookUltimate
version: '${version}'
main: com.xeonproductions.craftbookultimate.paper.CraftBookPlugin
bootstrapper: com.xeonproductions.craftbookultimate.paper.CraftBookBootstrap
api-version: '26.2'
description: Redstone circuitry, minecarts and sign mechanics.
authors:
  - Xeon Productions
website: https://github.com/xeonproductions/craftbook-ultimate
folia-supported: true

permissions:
  craftbook.command:
    description: Read the integrated circuit catalogue.
    default: true
  craftbook.reload:
    description: Reread the settings file and start every chip again under it.
    default: op
  craftbook.check:
    description: Ask which loaded chips cannot work as their signs are written.
    default: op
  craftbook.legacytable:
    description: Write out how blocks were spelled before the flattening, for the Sponge build.
    default: op
  craftbook.testbed:
    description: Build a test bed carrying a rig for every chip.
    default: op
  craftbook.debug:
    description: Be given an IC debug stick, and use the debugging commands.
    default: op
  craftbook.debug.menu:
    description: Report on a chip, and offer the rest as buttons.
    default: op
  craftbook.debug.trigger:
    description: Set a chip off without touching its inputs.
    default: op
  craftbook.debug.area:
    description: Outline the area a chip works on, in particles.
    default: op
  craftbook.debug.fields:
    description: Show what a chip is holding internally.
    default: op
  craftbook.debug.reload:
    description: Stop a chip and start it again.
    default: op
  craftbook.debug.ticking:
    description: List every chip currently ticking on its own.
    default: op
  craftbook.debug.band:
    description: Show what a wireless chip's band is carrying.
    default: op
  craftbook.music.list:
    description: List the songs and playlists a melody chip can name.
    default: true
  craftbook.switch.list:
    description: List the switches that command controlled chips are following.
    default: op
  craftbook.ic.safe.*:
    description: Build any chip that needs no elevated permission.
    default: true
  craftbook.ic.restricted.*:
    description: Build any chip, including those that act beyond their own surroundings.
    default: op
  craftbook.cart.station.use:
    description: Say where you are going, so the junctions route you there.
    default: true
  craftbook.cart.go:
    description: Pick a direction at a junction that has stopped to ask.
    default: true
  craftbook.cart.recipes:
    description: Look up what a recipe is called on a cart crafter's sign.
    default: true
  craftbook.cart.station:
    description: Make a station.
    default: true
  craftbook.cart.sort:
    description: Make a junction that sorts carts.
    default: true
  craftbook.cart.cartlift:
    description: Make a lift that carries carts between floors.
    default: true
  craftbook.cart.launch:
    description: Make a launcher that holds a cart until somebody gets in.
    default: true
  craftbook.cart.delay:
    description: Make a delay that holds a cart for a while.
    default: true
  craftbook.cart.print:
    description: Make a sign that is read aloud to whoever rides past.
    default: true
  craftbook.cart.collect:
    description: Make a bay that empties a passing cart into the chests beside it.
    default: true
  craftbook.cart.deposit:
    description: Make a bay that fills a passing cart from the chests beside it.
    default: true
  craftbook.cart.craft:
    description: Make a crafter that crafts inside a passing cart.
    default: op
  craftbook.cart.dispenser:
    description: Make a chest that hands carts out and takes them back.
    default: true
